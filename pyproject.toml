[build-system]
requires = ["scikit-build-core>=1.0", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "tqs-parameterization"
description = "Python bindings for the three-quadratic-surface (3QS) nuclear-shape parameterization library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/AleksanderAugustyn/tqs-parameterization"
Repository = "https://github.com/AleksanderAugustyn/tqs-parameterization"
Changelog = "https://github.com/AleksanderAugustyn/tqs-parameterization/blob/master/CHANGELOG.md"

[tool.scikit-build]
cmake.source-dir = "."
cmake.define.TQS_PARAM_BUILD_TESTS = "OFF"
# Default only (ambient CMAKE_GENERATOR still wins). Ninja + CMAKE_Fortran_PREPROCESS
# splits preprocess/compile, and the second pass trips fortran-foundations'
# -Wpedantic -Werror on Fortran's // concatenation ("C++ style comments" cpp note).
env.CMAKE_GENERATOR = "Unix Makefiles"
wheel.py-api = "py3"
wheel.packages = ["python/tqs_parameterization"]
sdist.exclude = [".idea/", ".claude/", ".superpowers/", ".github/"]

# Version from git tags (setuptools_scm).
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
